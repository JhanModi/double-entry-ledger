spring:
  application:
    name: double-entry-ledger
  config:
    # Local secrets live in .env (gitignored), the same file Docker Compose reads. Optional, so CI runs without it.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    # Until M3 the app connects as the owner role. The restricted app role arrives with the append-only tables.
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        # Only health is exposed. Endpoints such as env and heapdump would leak configuration and secrets.
        include: health
  endpoint:
    health:
      show-details: never
