spring:
  application:
    name: double-entry-ledger
  config:
    # Local secrets live in .env (gitignored), the same file Docker Compose reads. Optional, so CI runs without it.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    # The app connects as a restricted login that can't modify ledger history, disable triggers, or change the
    # schema (ADR-0015).
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
  flyway:
    # Migrations run as the owner, on a separate connection from the app's (same URL, different login).
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

logging:
  pattern:
    # Spring Boot inserts this into its default log pattern. Every line written while serving a request starts with
    # that request's id (ADR-0021); lines outside a request show [].
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        # Only health is exposed. Endpoints such as env and heapdump would leak configuration and secrets.
        include: health
  endpoint:
    health:
      show-details: never
